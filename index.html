<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="投递管家">
<meta name="application-name" content="实习投递管家">
<meta name="description" content="记录实习投递的公司、地点、薪资、要求、关键日期与面试进度，数据只存在本机。">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="mask-icon" href="./icon.svg" color="#4f46e5">
<title>实习投递管家</title>
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#eef1f7;
  --border:#e3e7ef; --border-strong:#cfd6e4;
  --text:#131a26; --text-2:#5b6577; --text-3:#8b95a7;
  --accent:#4f46e5; --accent-soft:#eef0ff; --accent-text:#4338ca;
  --danger:#dc2626; --danger-soft:#fdecec;
  --warn:#d97706; --warn-soft:#fdf3e3;
  --ok:#059669; --ok-soft:#e6f7f1;
  --info:#0284c7; --info-soft:#e6f3fb;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.06);
  --shadow-lg:0 10px 40px rgba(16,24,40,.16);
  --radius:14px; --radius-sm:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html[data-theme="dark"]{
  --bg:#0d1017; --surface:#151a23; --surface-2:#1a2029; --surface-3:#212936;
  --border:#262e3b; --border-strong:#38414f;
  --text:#e8ecf3; --text-2:#9aa5b6; --text-3:#6c7788;
  --accent:#7c7cf8; --accent-soft:#1e1f3d; --accent-text:#a5a5ff;
  --danger:#f87171; --danger-soft:#2a1a1c;
  --warn:#fbbf24; --warn-soft:#2a2213;
  --ok:#34d399; --ok-soft:#12271f;
  --info:#38bdf8; --info-soft:#12242e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  --shadow-lg:0 12px 44px rgba(0,0,0,.5);
}

/* ============ 基础 ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;min-height:100dvh;flex-direction:column}
main{flex:1;padding:0 0 calc(76px + var(--safe-b));max-width:1180px;width:100%;margin:0 auto}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:40;
  padding:max(10px,var(--safe-t)) 14px 10px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--border);
}
.topbar-in{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto}
.topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.2px;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sub{font-size:12px;color:var(--text-3);font-weight:500;margin-top:1px}
.brand-dot{width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;
  display:grid;place-items:center;font-size:16px}

/* ============ 视图容器 ============ */
.view{display:none;padding:14px}
.view.active{display:block;animation:fadeUp .18s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ 底部导航 ============ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);
  border-top:1px solid var(--border);
  padding-bottom:var(--safe-b);
}
.tabbar button{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 8px;color:var(--text-3);font-size:11px;font-weight:600;
  transition:color .15s;
}
.tabbar button svg{width:21px;height:21px;stroke-width:1.9}
.tabbar button[aria-selected="true"]{color:var(--accent)}

/* ============ 通用组件 ============ */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;box-shadow:var(--shadow);margin-bottom:12px;
}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;
  font-weight:700;color:var(--text-2);letter-spacing:.02em}
.card-h .count{margin-left:auto;font-weight:600;color:var(--text-3);font-size:12px}
.sec-title{font-size:13px;font-weight:700;color:var(--text-2);margin:20px 4px 9px;
  display:flex;align-items:center;gap:7px}
.sec-title:first-child{margin-top:4px}

.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--text-2)}
.dim{color:var(--text-3)}
.tiny{font-size:12px}
.small{font-size:13px}
.bold{font-weight:700}
.mono{font-variant-numeric:tabular-nums}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hidden{display:none !important}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.mb0{margin-bottom:0}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}

/* 按钮 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 14px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;
  background:var(--surface-3);color:var(--text);border:1px solid transparent;
  transition:transform .08s,opacity .15s;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px;stroke-width:2}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:var(--border-strong)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn.icon{padding:8px;border-radius:10px;background:transparent;color:var(--text-2)}
.btn:disabled{opacity:.45;pointer-events:none}

/* 表单 */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:5px}
.field label .req{color:var(--danger);margin-left:2px}
.field .hint{font-size:11.5px;color:var(--text-3);margin-top:4px;line-height:1.45}
input[type=text],input[type=url],input[type=email],input[type=tel],input[type=date],
input[type=datetime-local],input[type=number],select,textarea{
  width:100%;padding:10px 11px;border-radius:var(--radius-sm);
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  font-size:15px;transition:border-color .15s,box-shadow .15s;
  -webkit-appearance:none;appearance:none;
}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%238b95a7' stroke-width='2'><path d='M4 6.5l4 4 4-4'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:32px}
textarea{resize:vertical;min-height:84px;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
fieldset{border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin:0 0 14px}
fieldset legend{font-size:12px;font-weight:800;color:var(--text-3);padding:0 6px;
  letter-spacing:.06em;text-transform:uppercase}

/* 分段控件 */
.seg{display:flex;gap:4px;background:var(--surface-3);padding:4px;border-radius:11px;
  overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:7px 13px;border-radius:8px;font-size:13px;
  font-weight:650;color:var(--text-2);white-space:nowrap;transition:.15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* 徽标 / 胶囊 */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2.5px 9px;border-radius:999px;
  font-size:11.5px;font-weight:700;line-height:1.5;white-space:nowrap}
.st-interested{background:var(--surface-3);color:var(--text-2)}
.st-applied{background:var(--info-soft);color:var(--info)}
.st-written{background:var(--accent-soft);color:var(--accent-text)}
.st-interview{background:var(--warn-soft);color:var(--warn)}
.st-offer{background:var(--ok-soft);color:var(--ok)}
.st-rejected{background:var(--danger-soft);color:var(--danger)}
.st-archived{background:var(--surface-3);color:var(--text-3)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:8px;
  font-size:12px;background:var(--surface-3);color:var(--text-2);font-weight:600}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.danger{background:var(--danger-soft);color:var(--danger)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.accent{background:var(--accent-soft);color:var(--accent-text)}

/* 星星 */
.stars{display:inline-flex;gap:2px}
.stars button{padding:2px;color:var(--border-strong);line-height:0}
.stars button svg{width:22px;height:22px}
.stars button.on{color:#f5a623}
.stars.sm button svg{width:13px;height:13px}
.stars.readonly button{pointer-events:none}

/* 空状态 */
.empty{text-align:center;padding:44px 20px;color:var(--text-3)}
.empty .ico{font-size:38px;margin-bottom:10px;opacity:.55;line-height:1}
.empty h3{margin:0 0 6px;font-size:15px;color:var(--text-2);font-weight:700}
.empty p{margin:0 auto;font-size:13px;max-width:290px;line-height:1.65}

/* 工具行 */
.toolbar{display:flex;gap:8px;margin-bottom:11px}
.search{position:relative;flex:1}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;stroke:var(--text-3);stroke-width:2;pointer-events:none}
.search input{padding-left:34px}

/* 公司列表条目 */
.app-item{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;
  border-bottom:1px solid var(--border);cursor:pointer;transition:background .13s}
.app-item:last-child{border-bottom:none}
.app-item:active{background:var(--surface-2)}
@media(hover:hover){.app-item:hover{background:var(--surface-2)}}
.logo{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;
  font-weight:800;font-size:16px;color:#fff;letter-spacing:-.5px}
.app-item .nm{font-weight:700;font-size:15px;letter-spacing:-.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-item .pos{font-size:12.5px;color:var(--text-2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.app-item .meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;align-items:center;
  font-size:12px;color:var(--text-3)}
.app-item .meta i{font-style:normal;display:inline-flex;align-items:center;gap:3px}
.app-item .meta i svg,.tl-head .d svg,.tag svg{width:13px;height:13px;stroke-width:2}
svg.chev{width:16px;height:16px;flex:none;color:var(--text-3);stroke-width:2}
.due{font-weight:700}
.due.soon{color:var(--danger)}
.due.near{color:var(--warn)}

/* 统计块 */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:6px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px;box-shadow:var(--shadow)}
.stat .v{font-size:25px;font-weight:800;letter-spacing:-1px;line-height:1.15;
  font-variant-numeric:tabular-nums}
.stat .k{font-size:11.5px;color:var(--text-3);font-weight:650;margin-top:3px}
.stat.accent .v{color:var(--accent-text)}
.stat.ok .v{color:var(--ok)}
.stat.warn .v{color:var(--warn)}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.bar-row .lb{width:58px;flex:none;color:var(--text-2);font-weight:650}
.bar-track{flex:1;height:19px;background:var(--surface-3);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;transition:width .45s cubic-bezier(.2,.8,.2,1);min-width:2px}
.bar-row .vl{width:34px;text-align:right;flex:none;font-weight:700;font-variant-numeric:tabular-nums}

/* 时间线 */
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;
  background:var(--border);border-radius:2px}
.tl-item{position:relative;padding:0 0 16px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-22px;top:5px;width:11px;height:11px;
  border-radius:50%;background:var(--surface);border:2.5px solid var(--border-strong)}
.tl-item.ok::before{border-color:var(--ok)}
.tl-item.bad::before{border-color:var(--danger)}
.tl-item.hot::before{border-color:var(--warn)}
.tl-item.now::before{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tl-head .t{font-weight:700;font-size:13.5px}
.tl-head .d{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.tl-body{font-size:13px;color:var(--text-2);margin-top:3px;white-space:pre-wrap;
  word-break:break-word;line-height:1.6}
.tl-actions{display:flex;gap:6px;margin-top:5px;opacity:.75}

/* 附件 */
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.att{position:relative;border:1px solid var(--border);border-radius:11px;overflow:hidden;
  background:var(--surface-2);aspect-ratio:1;display:grid;place-items:center;cursor:pointer}
.att img{width:100%;height:100%;object-fit:cover;display:block}
.att .fx{font-size:12px;font-weight:800;color:var(--text-3)}
.att .nm{position:absolute;left:0;right:0;bottom:0;padding:3px 5px;font-size:10px;
  background:rgba(0,0,0,.62);color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .del{position:absolute;right:3px;top:3px;width:21px;height:21px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:13px;line-height:1}
.drop{border:1.5px dashed var(--border-strong);border-radius:var(--radius-sm);
  padding:15px;text-align:center;color:var(--text-3);font-size:12.5px;cursor:pointer;
  background:var(--surface-2);transition:.15s}
.drop:active{border-color:var(--accent);color:var(--accent-text)}
.drop.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}

/* 弹层 / 抽屉 */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(10,14,24,.5);
  backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;
  animation:fadeIn .16s ease}
.overlay.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);width:100%;max-height:94dvh;overflow-y:auto;
  border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);
  animation:slideUp .24s cubic-bezier(.2,.85,.25,1);
  padding-bottom:calc(18px + var(--safe-b));overscroll-behavior:contain}
@keyframes slideUp{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;z-index:3;background:var(--surface);
  padding:14px 16px 11px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px}
.sheet-head h2{margin:0;font-size:16.5px;font-weight:750;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{padding:15px 16px}
.sheet-foot{position:sticky;bottom:0;background:var(--surface);
  border-top:1px solid var(--border);padding:12px 16px;
  display:flex;gap:9px;padding-bottom:calc(12px + var(--safe-b))}
.sheet-foot .btn{flex:1}

/* 段落块（详情页） */
.kv{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv .k{width:74px;flex:none;color:var(--text-3);font-size:12.5px;font-weight:650;padding-top:1px}
.kv .v{flex:1;word-break:break-word;white-space:pre-wrap;min-width:0}
.longtext{white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.7;
  color:var(--text);background:var(--surface-2);border:1px solid var(--border);
  border-radius:11px;padding:11px;max-height:340px;overflow-y:auto}

/* FAB */
.fab{position:fixed;right:16px;bottom:calc(78px + var(--safe-b));z-index:55;
  width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;
  box-shadow:0 7px 22px color-mix(in srgb,var(--accent) 42%,transparent);
  display:grid;place-items:center;transition:transform .12s}
.fab:active{transform:scale(.92)}
.fab svg{width:26px;height:26px;stroke-width:2.4}

/* 提示条 */
.alert{display:flex;gap:9px;padding:11px 12px;border-radius:var(--radius-sm);
  font-size:12.5px;line-height:1.55;margin-bottom:12px;border:1px solid transparent}
.alert.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.alert.info{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 22%,transparent)}
.alert.danger{background:var(--danger-soft);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 22%,transparent)}
.alert b{font-weight:750}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,14px);
  z-index:200;background:#111827;color:#fff;padding:10px 17px;border-radius:11px;font-size:13.5px;
  font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.22s;
  max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
html[data-theme="dark"] #toast{background:#e8ecf3;color:#111827}

/* 图片预览 */
#lightbox{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.9);display:none;
  align-items:center;justify-content:center;padding:16px}
#lightbox.open{display:flex}
#lightbox img{max-width:100%;max-height:92dvh;border-radius:10px}
#lightbox .x{position:absolute;top:calc(14px + var(--safe-t));right:14px;color:#fff;
  font-size:28px;line-height:1;padding:6px 12px;background:rgba(255,255,255,.14);border-radius:10px}

/* 打印（导出 PDF） */
@media print{
  .tabbar,.fab,.topbar .btn,.no-print{display:none !important}
  body{background:#fff}
  .view{padding:0}
  .card{box-shadow:none;break-inside:avoid}
}

/* ============ 宽屏适配 ============ */
@media(min-width:700px){
  .stats-grid{grid-template-columns:repeat(4,1fr)}
  .grid2{grid-template-columns:1fr 1fr}
  .overlay{align-items:center}
  .sheet{max-width:660px;border-radius:18px;max-height:88dvh}
  .view{padding:18px 20px}
}
@media(min-width:1000px){
  #app{flex-direction:row}
  .tabbar{

/* 用 id 建索引的辅助函数。
   故意不用 Object.fromEntries：它是 ES2019，旧内核（部分安卓自带浏览器、
   老 WebView）里不存在，会让脚本在最开头就抛错、整个界面空白。 */
function byId(list){
  const m = {};
  for(let i = 0; i < list.length; i++) m[list[i].id] = list[i];
  return m;
}

const STATUS = [
  {id:"interested", label:"心动待投", short:"待投", cls:"st-interested", color:"#8b95a7", stage:-1},

  {id:"offer",      label:"已获 Offer", short:"Offer", cls:"st-offer",   color:"#059669", stage:3},
  {id:"rejected",   label:"已挂",     short:"已挂", cls:"st-rejected",   color:"#dc2626", stage:4},
  {id:"archived",   label:"已归档",   short:"归档", cls:"st-archived",   color:"#8b95a7", stage:5},

/* 事件类型：drives 表示该事件会自动把投递状态推进到 min(当前, drives) */

                     "#db2777","#0891b2","#65a30d","#ea580c","#2563eb","#9333ea"];

/* ============================================================

const ICONS = {

function svg(name, cls){
  const s = document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("viewBox","0 0 24 24");
  s.setAttribute("fill","none");
  s.setAttribute("stroke","currentColor");
  s.setAttribute("stroke-linecap","round");
  s.setAttribute("stroke-linejoin","round");
  if(cls) s.setAttribute("class", cls);
  s.innerHTML = ICONS[name] || ICONS.file;
  return s;
}

/* ============================================================
   3. 通用工具
   ============================================================ */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

function el(tag, opts, kids){
  const n = document.createElement(tag);
  const o = opts || {};
  if(o.cls)   n.className = o.cls;
  if(o.text != null) n.textContent = o.text;
  if(o.html != null) n.innerHTML = o.html;
  if(o.attrs) for(const k in o.attrs){ if(o.attrs[k] != null) n.setAttribute(k, o.attrs[k]); }
  if(o.style) for(const k in o.style) n.style[k] = o.style[k];
  if(o.on)    for(const k in o.on) n.addEventListener(k, o.on[k]);
  if(o.data)  for(const k in o.data) n.dataset[k] = o.data[k];
  (Array.isArray(kids) ? kids : (kids != null ? [kids] : [])).forEach(c => {
    if(c == null || c === false) return;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return n;
}
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); return n; }
function uid(p){ return (p || "id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

/* --- 日期 --- */
function todayISO(){ return isoOf(new Date()); }
function isoOf(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function parseDay(s){
  if(!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
  if(!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return isNaN(d.getTime()) ? null : d;
}
function dayDiff(iso){
  const d = parseDay(iso);
  if(!d) return null;
  const t = parseDay(todayISO());
  return Math.round((d - t) / DAY);
}
function fmtDate(iso){
  const d = parseDay(iso);
  if(!d) return "—";
  return d.getFullYear() + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + String(d.getDate()).padStart(2,"0");
}
function fmtDateShort(iso){
  const d = parseDay(iso);
  if(!d) return "—";
  return (d.getMonth()+1) + "月" + d.getDate() + "日";
}
function fmtMonth(iso){
  const d = parseDay(iso);
  return d ? (d.getFullYear() + "年" + (d.getMonth()+1) + "月") : "—";
}
function weekdayCN(iso){
  const d = parseDay(iso);
  return d ? "周" + WEEK[d.getDay()] : "";
}
function relFrom(iso){
  const n = dayDiff(iso);
  if(n == null) return "";
  if(n === 0) return "今天";
  if(n === 1) return "明天";
  if(n === 2) return "后天";
  if(n === -1) return "昨天";
  if(n > 0)  return n + " 天后";
  return Math.abs(n) + " 天前";
}
function clockOf(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

/* --- DOM 小工具 --- */
function iconBtn(name, title, fn, cls){
  return el("button", {cls:"btn icon " + (cls||""), attrs:{title:title, "aria-label":title}, on:{click:fn}}, [svg(name)]);
}
/* 安全外链：只允许 http/https，其余用文本展示 */
function safeUrl(u){
  if(!u) return null;
  const s = String(u).trim();
  return /^https?:\/\//i.test(s) ? s : null;
}
function linkEl(url, label, cls){
  const ok = safeUrl(url);
  if(!ok) return null;
  return el("a", {cls:cls||"", text:label||url, attrs:{href:ok, target:"_blank", rel:"noopener noreferrer"}});
}

/* ============================================================
   4. 薪资解析 / 展示
   ============================================================ */
function parseSalary(text){
  if(!text) return null;
  const s = String(text).trim();
  if(!s) return null;
  const nums = (s.match(/\d+(?:\.\d+)?/g) || []).map(Number).filter(n => n > 0);
  if(!nums.length) return null;
  let unit = "month";
  if(/小时|\/\s*h|hour|时薪/i.test(s)) unit = "hour";
  else if(/天|日薪|\/\s*d|day/i.test(s)) unit = "day";
  else if(/年|年薪|\/\s*y|year/i.test(s)) unit = "year";
  else if(/月|月薪|\/\s*m|month|k\b/i.test(s)) unit = "month";

  const isK = /k/i.test(s) && Math.max.apply(null, nums) < 1000;
  let v = nums.map(n => isK ? n * 1000 : n);
  if(v.length >= 2) v = v.slice(0, 2);
  const factor = (UNIT_MAP[unit] || UNIT_MAP.month).perMonth;
  return {
    min: Math.min.apply(null, v) * factor,
    max: Math.max.apply(null, v) * factor,
    monthly: (v.reduce((a,b) => a+b, 0) / v.length) * factor,
  };
}
function unitLabel(unit){ return (UNIT_MAP[unit] || UNIT_MAP.month).label; }
function fmtMoney(n){
  if(n == null || isNaN(n)) return "—";
  if(n >= 10000) return (n/10000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/,"") + "万";
  return Math.round(n).toLocaleString("zh-CN");
}
function salaryText(app){
  const parts = [];
  if(app.salary) parts.push(app.salary);
  const d = app.salaryDaily;
  if(d && !parts.length) parts.push("¥" + d + "/天");
  const m = monthlySalary(app);
  if(m && !parts.length) parts.push("约 ¥" + fmtMoney(m) + "/月");
  return parts.length ? parts.join(" · ") : "";
}
function monthlySalary(app){
  if(app.salaryDaily) return Number(app.salaryDaily) * MONTH_DAYS;
  const p = parseSalary(app.salary);
  return p ? p.monthly : null;
}
function dailyRate(app){
  if(app.salaryDaily) return Number(app.salaryDaily);
  const m = monthlySalary(app);
  return m ? m / MONTH_DAYS : null;
}

/* ============================================================
   5. 数据层
   ============================================================ */
const DEFAULT_SETTINGS = {theme:"auto", view:"card", daysAhead:14, showArchived:false};
let state = load();
function blankState(){
  return {version:1, apps:[], events:[], settings:Object.assign({}, DEFAULT_SETTINGS)};
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return blankState();
    const p = JSON.parse(raw);
    const s = blankState();
    s.apps = Array.isArray(p.apps) ? p.apps : [];
    s.events = Array.isArray(p.events) ? p.events : [];
    s.settings = Object.assign(s.settings, p.settings || {});
    s.apps.forEach(a => {
      if(!a.id) a.id = uid("app");
      if(!STATUS_MAP[a.status]) a.status = "interested";
      if(a.priority == null) a.priority = 3;
      a.attachments = Array.isArray(a.attachments) ? a.attachments : [];
      a.tags = Array.isArray(a.tags) ? a.tags : [];
    });
    s.events.forEach(e => {
      if(!e.id) e.id = uid("ev");
      if(!EVENT_MAP[e.type]) e.type = "note";
    });
    return s;
  }catch(err){
    console.warn("读取本地数据失败，已使用空数据", err);
    return blankState();
  }
}
let saveTimer = null;
/* 有些环境（部分浏览器的 file:// 、无痕模式、禁用 Cookie）会禁用 localStorage，
   这里探测一次，探测失败时应用仍可用，只是不落盘，并给出明显提示。 */
const CAN_PERSIST = (function(){
  try{
    const k = "__it_probe__";
    localStorage.setItem(k, "1");
    localStorage.removeItem(k);
    return true;
  }catch(err){ return false; }
})();
function save(){
  if(!CAN_PERSIST) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 120);
}
function flush(){
  if(!CAN_PERSIST) return false;
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    return true;
  }catch(err){
    toast("保存失败：手机存储空间可能已满");
    console.error(err);
    return false;
  }
}

function appById(id){ return state.apps.find(a => a.id === id) || null; }
function eventsOf(appId){
  return state.events.filter(e => e.appId === appId).sort((a,b) => b.ts - a.ts);
}
function addEvent(app, ev){
  const e = Object.assign({id:uid("ev"), appId:app.id, ts:Date.now()}, ev);
  state.events.push(e);
  return e;
}
function touch(app){ app.updatedAt = Date.now(); }

/* 当前状态：投递记录上存的状态与事件应有的状态取“更靠前”的那个（不回退） */
function currentStatus(app){
  const own = STATUS_MAP[app.status] || STATUS_MAP.interested;
  return own;
}
/* 记录一次事件后，是否应推进状态 */
function statusAfter(app, typeId){
  const t = EVENT_MAP[typeId];
  if(!t || !t.drives) return false;
  const cur = STATUS_MAP[app.status], next = STATUS_MAP[t.drives];
  if(!cur || !next) return false;
  if(cur.id === "rejected" || cur.id === "archived") return false;
  if(next.stage === cur.stage) return false;
  if(next.id === "rejected") return next.id;         /* 被拒总是可以推进 */
  if(next.stage > cur.stage) return next.id;
  return false;
}

/* 附件（IndexedDB，避免撑爆 localStorage） */
const Attach = (function(){
  const DB = "intern-tracker-files", STORE = "files";
  let dbp = null;
  function db(){
    if(dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if(!("indexedDB" in window)) return rej(new Error("no-idb"));
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }).catch(err => { dbp = null; throw err; });
    return dbp;
  }
  function tx(mode, fn){
    return db().then(d => new Promise((res, rej) => {
      const t = d.transaction(STORE, mode), st = t.objectStore(STORE);
      const req = fn(st);
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    }));
  }
  return {
    put(key, blob){ return tx("readwrite", st => st.put(blob, key)); },
    get(key){ return tx("readonly", st => st.get(key)); },
    del(key){ return tx("readwrite", st => st.delete(key)); },
    keys(){ return tx("readonly", st => st.getAllKeys()).then(k => Array.from(k || [])); },
    has(){ return db().then(() => true).catch(() => false); }
  };
})();
function blobUrl(blob){ return URL.createObjectURL(blob); }

/* ============================================================
   6. 关键日期 / 统计
   ============================================================ */
const DUE_FIELDS = [
  {key:"deadline",  label:"投递截止", tone:"danger"},
  {key:"writtenAt", label:"笔试/测评", tone:"accent"},
  {key:"interviewAt", label:"面试",   tone:"warn"},
  {key:"followUpAt", label:"跟进提醒", tone:"info"},
];

/* 提醒开关：daysAhead 为 "off" 表示永不提醒（总览不显示关键日期与逾期卡片），
   日期本身照常保存在记录里，随时可以再打开。 */
function remindersOff(){ return state.settings.daysAhead === "off"; }
function activeDays(){ return remindersOff() ? 0 : (Number(state.settings.daysAhead) || 14); }

function upcoming(limitDays){
  if(remindersOff()) return [];
  const out = [];
  state.apps.forEach(a => {
    if(a.status === "rejected" || a.status === "archived") return;
    DUE_FIELDS.forEach(f => {
      const v = a[f.key];
      if(!v) return;
      const n = dayDiff(v);
      if(n == null || n < 0) return;
      if(limitDays != null && n > limitDays) return;
      out.push({app:a, field:f.key, label:f.label, date:v, days:n, tone:f.tone});
    });
  });
  return out.sort((x,y) => x.days - y.days || x.app.company.localeCompare(y.app.company,"zh"));
}
function overdue(){
  if(remindersOff()) return [];
  const out = [];
  state.apps.forEach(a => {
    if(a.status === "rejected" || a.status === "archived" || a.status === "offer") return;
    DUE_FIELDS.forEach(f => {
      const v = a[f.key];
      if(!v) return;
      const n = dayDiff(v);
      if(n == null || n >= 0) return;
      out.push({app:a, label:f.label, date:v, days:n, tone:f.tone});
    });
  });
  return out.sort((x,y) => y.days - x.days);
}
function stats(){
  const s = {total:state.apps.length, byStatus:{}, interview:0, offer:0, rejected:0,
             applied:0, active:0, noReply:0, subs:0, evCount:state.events.length};
  STATUS.forEach(st => s.byStatus[st.id] = 0);
  state.apps.forEach(a => {
    s.byStatus[a.status] = (s.byStatus[a.status] || 0) + 1;
    const st = STATUS_MAP[a.status];
    if(st && st.stage >= 0) s.applied++;
    if(a.status === "offer") s.offer++;
    else if(a.status === "rejected") s.rejected++;
    if(a.status === "interview" || a.status === "offer") s.interview++;
    if(!["rejected","offer","archived"].includes(a.status)) s.active++;
    if(a.status === "applied"){
      const last = eventsOf(a.id)[0];
      const daysSince = last ? Math.floor((Date.now() - last.ts)/DAY) : null;
      if(daysSince != null && daysSince >= 7) s.noReply++;
    }
  });
  s.subs = state.events.filter(e => e.type === "submit").length;
  const base = s.subs || s.applied || 1;
  s.rateInterview = Math.round(s.interview / base * 100);
  s.rateOffer = Math.round(s.offer / base * 100);
  return s;
}
function salaryList(){
  return state.apps.map(monthlySalary).filter(n => n && n > 0).sort((a,b) => a - b);
}
function colorOf(name){
  let h = 0;
  for(let i = 0; i < (name||"").length; i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return LOGO_COLORS[h % LOGO_COLORS.length];
}
function initialOf(name){
  const s = String(name||"?").trim();
  if(!s) return "?";
  const m = /^[A-Za-z]/.exec(s);
  return m ? m[0].toUpperCase() : s[0];
}
function sortApps(list){
  const sv = state.settings.sort || "updated";
  const arr = list.slice();
  arr.sort((a,b) => {
    if(sv === "priority") return (b.priority||0) - (a.priority||0) || b.updatedAt - a.updatedAt;
    if(sv === "salary")   return (monthlySalary(b)||0) - (monthlySalary(a)||0);
    if(sv === "deadline"){
      const na = nearestDue(a), nb = nearestDue(b);
      return (na == null ? 9e9 : na) - (nb == null ? 9e9 : nb);
    }
    if(sv === "company")  return String(a.company).localeCompare(String(b.company),"zh");
    if(sv === "status")   return (STATUS_MAP[a.status]||{}).stage - (STATUS_MAP[b.status]||{}).stage;
    return (b.updatedAt||0) - (a.updatedAt||0);
  });
  return arr;
}
function nearestDue(app){
  let best = null;
  DUE_FIELDS.forEach(f => {
    const n = dayDiff(app[f.key]);
    if(n == null || n < 0) return;
    if(best == null || n < best) best = n;
  });
  return best;
}
function dueTag(iso, label){
  const n = dayDiff(iso);
  if(n == null) return null;
  const cls = n <= 2 ? "due soon" : (n <= 7 ? "due near" : "due");
  return el("span", {cls:cls, text:(n === 0 ? "今天" : n + "天后") + " " + (label||"")});
}

function applyTheme(){
  const pref = (state.settings && state.settings.theme) || "auto";
  const dark = pref === "dark" ||
    (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  const m = $('meta[name="theme-color"]');
  if(m) m.setAttribute("content", dark ? "#0d1017" : "#ffffff");
  const b = $("#btnTheme");
  if(b){ clear(b); b.appendChild(svg(dark ? "sun" : "moon")); }
}
function toggleTheme(){
  const wasDark = document.documentElement.getAttribute("data-theme") === "dark";
  state.settings.theme = wasDark ? "light" : "dark";
  save();
  applyTheme();
  toast(wasDark ? "已切到浅色" : "已切到深色");
}
(function watchSystemTheme(){
  try{
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const fn = () => { if((state.settings.theme || "auto") === "auto") applyTheme(); };
    if(mq.addEventListener) mq.addEventListener("change", fn);
    else if(mq.addListener) mq.addListener(fn);
  }catch(err){ /* 老浏览器忽略即可 */ }
})();

let sheetOnClose = null;

  $("#sheetTitle").textContent = title;

function filterApps(){
  const q = (state.settings.q || "").trim().toLowerCase();
  const f = state.settings.filter || "all";
  const showArch = !!state.settings.showArchived;
  let list = state.apps.filter(a => {
    if(!showArch && a.status === "archived" && f !== "archived") return false;
    if(f !== "all" && a.status !== f) return false;
    if(!q) return true;
    const hay = [a.company, a.position, a.location, a.notes, a.requirements, a.jd,
                 a.contactName, a.contactInfo, (a.tags||[]).join(" ")].join(" ").toLowerCase();
    return hay.indexOf(q) >= 0;
  });
  return sortApps(list);
}

function renderTimeline(root){
  const apps = state.apps.slice().sort((a,b) => String(a.company).localeCompare(String(b.company),"zh"));
  const f = state.settings.tlApp || "all";

  const seg = el("div", {cls:"seg mb12"});
  seg.appendChild(el("button", {
    attrs:{"aria-pressed": String(f === "all")}, text:"全部公司",
    on:{click:() => { state.settings.tlApp = "all"; save(); render(); }}
  }));
  apps.forEach(a => seg.appendChild(el("button", {
    attrs:{"aria-pressed": String(f === a.id)}, text:a.company,
    on:{click:() => { state.settings.tlApp = a.id; save(); render(); }}
  })));
  root.appendChild(seg);

  let evs = state.events.slice();
  if(f !== "all") evs = evs.filter(e => e.appId === f);
  evs.sort((a,b) => b.ts - a.ts);

  if(!evs.length){
    root.appendChild(el("div", {cls:"empty"}, [
      el("div", {cls:"ico", text:"🕒"}),
      el("h3", {text:"还没有动态"}),
      el("p", {text:"投递、笔试、每轮面试、Offer、被拒都可以记一条。打开某家公司的详情页，点「记一条动态」。"}),
    ]));
    return;
  }

  /* 按“天”分组 */
  const groups = [];
  let cur = null;
  evs.forEach(e => {
    const d = isoOf(new Date(e.ts));
    if(!cur || cur.day !== d){ cur = {day:d, items:[]}; groups.push(cur); }
    cur.items.push(e);
  });

  let lastMonth = "";
  groups.forEach(g => {
    const m = fmtMonth(g.day);
    if(m !== lastMonth){
      lastMonth = m;
      root.appendChild(el("div", {cls:"sec-title"}, [svg("cal"), el("span", {text:m})]));
    }
    const card = el("div", {cls:"card"});
    card.appendChild(el("div", {cls:"card-h"}, [
      el("span", {text:fmtDateShort(g.day) + " " + weekdayCN(g.day)}),
      el("span", {cls:"count", text:relFrom(g.day)}),
    ]));
    const tl = el("div", {cls:"tl"});
    g.items.forEach(e => tl.appendChild(eventItem(e, true)));
    card.appendChild(tl);
    root.appendChild(card);
  });
}
function eventItem(e, showApp){

function download(name, text, mime){
  const blob = new Blob([text], {type:(mime || "text/plain") + ";charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = el("a", {attrs:{href:url, download:name}});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function attTile(app, at, editable){
  const box = el("div", {cls:"att"});
  const isImg = /^image\//.test(at.type || "");
  box.appendChild(el("div", {cls:"fx", text:isImg ? "🖼" : (at.name || "").split(".").pop().slice(0,4).toUpperCase()}));
  box.appendChild(el("div", {cls:"nm", text:at.name || "附件"}));
  if(editable){
    box.appendChild(el("button", {cls:"del no-print", text:"×", attrs:{title:"删除附件"},
      on:{click: e => {
        e.stopPropagation();
        confirmSheet("删除这个附件？", at.name || "", "删除", () => {
          app.attachments = (app.attachments || []).filter(x => x.id !== at.id);
          save(); Attach.del(at.id).catch(() => {}); render(); toast("已删除附件");
        }, true);
      }}}));
  }
  box.addEventListener("click", () => {
    Attach.get(at.id).then(blob => {
      if(!blob){ toast("文件已丢失（可能是清过浏览器数据）"); return; }
      if(isImg){
        const u = blobUrl(blob);
        $("#lightboxImg").src = u;
        $("#lightbox").classList.add("open");
      } else {
        const u = blobUrl(blob);
        const link = el("a", {attrs:{href:u, download:at.name || "file", target:"_blank", rel:"noopener"}});
        document.body.appendChild(link); link.click(); link.remove();
      }
    }).catch(() => toast("读取附件失败"));
  });
  /* 异步补缩略图 */
  if(isImg){
    Attach.get(at.id).then(blob => {
      if(!blob) return;
      const u = blobUrl(blob);
      const img = el("img", {attrs:{src:u, alt:at.name || "", loading:"lazy"}});
      box.insertBefore(img, box.firstChild);
      const fx = box.querySelector(".fx"); if(fx) fx.remove();
    }).catch(() => {});
  }
  return box;
}
const MAX_ATT = 10 * 1024 * 1024;
function addAttachments(app, files){
  const arr = Array.from(files || []);
  if(!arr.length) return;
  let ok = 0, skip = 0;
  let chain = Promise.resolve();
  arr.forEach(f => {
    chain = chain.then(() => {
      if(f.size > MAX_ATT){ skip++; return; }
      const id = uid("att");
      return Attach.put(id, f).then(() => {
        app.attachments = app.attachments || [];
        app.attachments.push({id:id, name:f.name, type:f.type, size:f.size, addedAt:Date.now()});
        ok++;
      }).catch(() => { skip++; });
    });
  });
  chain.then(() => {
    touch(app); save(); render();
    toast("已添加 " + ok + " 个附件" + (skip ? "，" + skip + " 个失败或超过 10MB" : ""));
  });
}

function EID_FOR(status){
  if(status === "offer") return "offer";
  if(status === "rejected") return "rejected";
  if(status === "written") return "written";
  if(status === "interview") return "interview";
  if(status === "applied") return "submit";
  return "note";
}

/* ============================================================
   19. PWA：安装到桌面 + 离线缓存
   ============================================================ */
const PWA = (function(){
  let installEvent = null;      /* Android/Chrome 抓到的安装事件 */
  let installed = false;        /* 是否已经在独立窗口里运行 */
  let swReg = null;
  let updateReady = false;
  let reloaded = false;         /* 防止 controllerchange 触发多次刷新 */
  const listeners = [];

  function isStandalone(){
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
           window.navigator.standalone === true ||
           document.referrer.indexOf("android-app://") === 0;
  }
  function isIOS(){
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
           (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }
  function isSecureContextOk(){
    return location.protocol === "https:" || location.hostname === "localhost" ||
           location.hostname === "127.0.0.1";
  }
  function isFileProtocol(){ return location.protocol === "file:"; }

  /* 状态：'installed' | 'ready'（可一键装）| 'ios'（手动添加到主屏幕）| 'insecure'（需要 https）| 'file'（本地文件） */
  function state(){
    if(installed || isStandalone()) return "installed";
    if(isFileProtocol()) return "file";
    if(installEvent) return "ready";
    if(isIOS()) return "ios";
    if(!isSecureContextOk()) return "insecure";
    return "manual";
  }
  function onChange(fn){ listeners.push(fn); }
  function emit(){ listeners.forEach(fn => { try{ fn(); }catch(e){} }); }

  function promptInstall(){
    if(!installEvent){ toast("这个浏览器没给出安装入口，请用浏览器菜单里的「安装应用 / 添加到主屏幕」"); return Promise.resolve("unavailable"); }
    const ev = installEvent;
    installEvent = null;
    ev.prompt();
    return ev.userChoice.then(choice => {
      if(choice && choice.outcome === "accepted"){ toast("已开始安装，去桌面上找「投递管家」"); }
      else { toast("已取消，随时可以在设置里再装"); installEvent = ev; }
      emit();
      return choice && choice.outcome;
    }).catch(() => "error");
  }

  function registerSW(){
    if(!("serviceWorker" in navigator)) return;
    if(!isSecureContextOk()) return;                 /* file:// 和 http(非本机) 装不了 SW */
    navigator.serviceWorker.register("./sw.js", {scope:"./"}).then(reg => {
      swReg = reg;
      if(reg.waiting && navigator.serviceWorker.controller) markUpdate();
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange", () => {
          if(nw.state === "installed" && navigator.serviceWorker.controller) markUpdate();
        });
      });
      /* 每次回到前台顺手查一次更新 */
      document.addEventListener("visibilitychange", () => {
        if(!document.hidden) reg.update().catch(() => {});
      });
    }).catch(err => {
      console.warn("Service Worker 注册失败（离线缓存不可用，应用仍可正常使用）", err);
    });
    navigator.serviceWorker.addEventListener("message", e => {
      if(e.data && e.data.type === "SW_UPDATED") markUpdate();
    });
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      /* 只有“确实检测到新版本”且还没刷过时才刷新，避免首次安装 SW 时白刷一次 */
      if(updateReady && !reloaded){ reloaded = true; location.reload(); }
    });
  }
  function markUpdate(){
    if(updateReady) return;
    updateReady = true;
    toast("有新版本，正在更新…");
    setTimeout(() => {
      if(swReg && swReg.waiting){ swReg.waiting.postMessage({type:"SKIP_WAITING"}); }
      if(!reloaded){ reloaded = true; location.reload(); }
    }, 700);
  }

  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    installEvent = e;
    emit();
  });
  window.addEventListener("appinstalled", () => {
    installed = true; installEvent = null;
    toast("已装到桌面，以后从这里直接打开");
    emit();
  });
  if(window.matchMedia){
    const mq = window.matchMedia("(display-mode: standalone)");
    const fn = () => { installed = isStandalone(); emit(); };
    if(mq.addEventListener) mq.addEventListener("change", fn);
    else if(mq.addListener) mq.addListener(fn);
  }

  return {
    state:state, onChange:onChange, promptInstall:promptInstall,
    registerSW:registerSW, isSecureContextOk:isSecureContextOk,
    isIOS:isIOS, isStandalone:isStandalone
  };
})();

function installCard(){
  const c = el("div", {cls:"card"});

  function paint(){
    clear(c);
    c.appendChild(el("div", {cls:"card-h"}, [svg("download"), el("span", {text:"装到手机桌面"})]));
    const st = PWA.state();

    if(st === "installed"){
      c.appendChild(el("div", {cls:"row", style:{gap:"8px"}}, [
        el("span", {cls:"tag ok", text:"已安装"}),
        el("span", {cls:"small muted", text:"正以独立 App 方式运行，支持离线使用。"}),
      ]));
      return;
    }

    /* 提示按“当前状态 + 设备类型”组合，避免 iOS 用户看到无关的 http 提示 */
    let msg;
    if(PWA.isIOS()) msg = "iPhone / iPad 只能用 Safari 添加：点底部的「分享」按钮 → 往下找到「添加到主屏幕」→ 命名后点添加。（微信内置浏览器、Chrome for iOS 都不支持）";
    else if(st === "ready") msg = "这个浏览器支持一键安装：点下面的按钮，桌面上就会出现「投递管家」图标，打开后没有地址栏，完全离线可用。";
    else if(st === "insecure") msg = "当前是 http 访问，浏览器不允许安装。用 https 网址打开（例如挂到 GitHub Pages）就能装了。";
    else if(st === "file") msg = "当前是本地文件方式打开的，浏览器不允许安装成 App。先用网址访问（见 README），再回来安装。";
    else msg = "没检测到自动安装入口：请用浏览器菜单里的「安装应用」或「添加到主屏幕」。";
    c.appendChild(el("div", {cls:"small muted mb12", text:msg}));

    if(st === "ready" && !PWA.isIOS()){
      c.appendChild(el("div", {cls:"alert info", style:{marginBottom:"11px"}}, [
        el("div", {text:"离线可用：装好后即使没网也能打开和记录，数据照样存在本机。"}),
      ]));
    }

    const row = el("div", {cls:"row wrap", style:{gap:"8px"}});
    if(st === "ready" && !PWA.isIOS()){
      row.appendChild(el("button", {cls:"btn primary", on:{click:() => PWA.promptInstall().then(() => paint())}},
        [svg("plus"), el("span", {text:"一键安装"})]));
    } else if(!PWA.isIOS() && st !== "file" && st !== "insecure"){
      row.appendChild(el("button", {cls:"btn primary", on:{click:() => PWA.promptInstall()}},
        [svg("plus"), el("span", {text:"尝试安装"})]));
    }
    row.appendChild(el("button", {cls:"btn ghost", on:{click:pwaDiag}}, [svg("check"), el("span", {text:"检查安装条件"})]));
    c.appendChild(row);
  }
  paint();
  PWA.onChange(paint);
  return c;
}

/* 安装条件自检：把浏览器给出的判断依据摊开，方便排查“为什么装不了” */
function pwaDiag(){
  const standalone = !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  const rows = [
    ["页面地址", location.href],
    ["协议", location.protocol + (PWA.isSecureContextOk() ? "（允许安装）" : "（需要 https 或 localhost）")],
    /* 这两条用来区分“真安装”和“只是加了个浏览器快捷方式” */
    ["当前是不是独立 App", standalone
      ? "是 —— 真安装成功（无地址栏，离线可用）"
      : "不是 —— 现在只是普通网页。如果是从桌面图标点进来的，那说明那个图标只是浏览器快捷方式，不是真安装"],
    ["设置里有没有安装入口", (function(){
      const st = PWA.state();
      return ({ready:"有，可一键安装", installed:"已安装", ios:"iOS 需手动添加", insecure:"没有（不是安全上下文）",
               file:"没有（file:// 方式）", manual:"没有，需用浏览器菜单手动添加"})[st] || st;
    })()],
    ["Service Worker 支持", ("serviceWorker" in navigator) ? "支持" : "不支持"],
    ["Service Worker 状态", (function(){
      try{
        if(!("serviceWorker" in navigator)) return "不支持";
        if(!navigator.serviceWorker.controller) return "尚未接管（首次打开正常，刷新一次即可）";
        return "已接管 —— 离线可用";
      }catch(e){ return "读取失败"; }
    })()],
    ["manifest 是否被读到", (function(){
      const l = document.querySelector('link[rel="manifest"]');
      return l ? l.getAttribute("href") : "没有 manifest 链接";
    })()],
    ["运行模式", standalone ? "standalone（独立窗口）" : "browser（带地址栏的普通页签）"],
    ["系统 / 浏览器", (PWA.isIOS() ? "iOS / iPadOS" : "Android 或桌面") + " · " + (navigator.userAgent.indexOf("Chrome/") >= 0 ? "Chromium 内核" : "非 Chromium 内核")],
  ];
  const body = el("div");
  rows.forEach(([k, v]) => {
    const valEl = (k === "页面地址" && /^https?:/.test(String(v)))
      ? linkEl(String(v), String(v))
      : el("span", {text:String(v)});
    body.appendChild(el("div", {cls:"kv"}, [
      el("span", {cls:"k", text:k, style:{width:"132px"}}),
      el("span", {cls:"v"}, [valEl]),
    ]));
  });
  body.appendChild(el("div", {cls:"alert info mt12", style:{marginBottom:"0"}}, [
    el("div", {text:"装不了通常是三个原因：① 用 http 而不是 https；② 用 file:// 直接打开文件；③ iOS 上必须用 Safari（微信内置浏览器、Chrome for iOS 都不行）。"}),
  ]));
  body.appendChild(el("div", {cls:"alert warn mt8", style:{marginBottom:"0"}}, [
    el("div", {text:"「当前是不是独立 App」显示“不是”，但桌面上已经有图标？那是浏览器快捷方式而不是真安装（比如某些国产浏览器的“添加到桌面”）。真安装的标志是：打开后没有地址栏、断网也能用。这种浏览器请换 Chrome 或 Edge 再装一次。"}),
  ]));
  openSheet("安装条件检查", body, [el("button", {cls:"btn primary", text:"知道了", on:{click:closeSheet}})]);
}

/* ============================================================
   20. 自检（打开 index.html?selftest=1 触发，不影响正常使用）
   ============================================================ */
function runSelfTest(){
  const results = [];
  const ok = (name, cond, detail) => results.push({name:name, pass:!!cond, detail:detail});
  const near = (a, b, tol) => a != null && Math.abs(a - b) <= (tol == null ? 1 : tol);

  /* 薪资解析 */
  ok("200/天 -> 月薪 4350", near((parseSalary("200/天") || {}).monthly, 200 * 21.75));
  ok("日薪中文「200元一天」-> 识别为天", near((parseSalary("200元一天") || {}).monthly, 4350), JSON.stringify(parseSalary("200元一天")));
  ok("4-6k -> 取均值 5000", near((parseSalary("4-6k") || {}).monthly, 5000));
  ok("25元/小时 -> 月薪 4350", near((parseSalary("25元/小时") || {}).monthly, 25 * 174));
  ok("8k×14薪 -> 识别为月薪 8000", near((parseSalary("8k×14薪") || {}).monthly, 8000), JSON.stringify(parseSalary("8k×14薪")));
  ok("年薪 24万 -> 月薪 20000", near((parseSalary("24万/年") || {}).monthly, 20000), JSON.stringify(parseSalary("24万/年")));
  ok("空薪资 -> null", parseSalary("") === null && parseSalary("面议") === null);
  const dc = dailyRate({salaryDaily:200});
  ok("日薪 200 -> 日均 200", near(dc, 200));
  ok("money 格式化", fmtMoney(12000) === "1.2万" && fmtMoney(3400) === "3,400", fmtMoney(12000) + "/" + fmtMoney(3400));

  /* 日期 */
  const t = todayISO();
  ok("todayISO 格式 YYYY-MM-DD", /^\d{4}-\d{2}-\d{2}$/.test(t), t);
  ok("dayDiff 今天 = 0", dayDiff(t) === 0);
  const d3 = isoOf(new Date(Date.now() + 3 * DAY));
  ok("dayDiff 三天后 = 3", dayDiff(d3) === 3, String(dayDiff(d3)));
  const dm1 = isoOf(new Date(Date.now() - DAY));
  ok("dayDiff 昨天 = -1", dayDiff(dm1) === -1, String(dayDiff(dm1)));
  ok("parseDay 非法输入 -> null", parseDay("abc") === null && parseDay(null) === null);
  ok("relFrom 文案", relFrom(t) === "今天" && relFrom(d3) === "3 天后" && relFrom(dm1) === "昨天",
     relFrom(t) + "/" + relFrom(d3) + "/" + relFrom(dm1));

  /* 状态推进规则 */
  const mk = st => ({id:"x", status:st, company:"测试", priority:3, attachments:[]});
  ok("已投 + 面试 -> 面试中", statusAfter(mk("applied"), "interview") === "interview");
  ok("已投 + 笔试 -> 笔试中", statusAfter(mk("applied"), "written") === "written");
  ok("笔试中 + 投递事件 -> 不回退", statusAfter(mk("written"), "submit") === false);
  ok("面试中 + Offer -> Offer", statusAfter(mk("interview"), "offer") === "offer");
  ok("已挂 + 面试 -> 不复活", statusAfter(mk("interview"), "rejected") === "rejected" && statusAfter(mk("rejected"), "interview") === false);
  ok("备注事件不推进状态", statusAfter(mk("applied"), "note") === false);

  /* 统计口径 */
  const had = state.apps, hadEv = state.events;
  state.apps = [
    {id:"t1", company:"A", status:"interview", priority:5, attachments:[], salary:"200/天"},
    {id:"t2", company:"B", status:"offer", priority:4, attachments:[], salary:"6k"},
    {id:"t3", company:"C", status:"rejected", priority:2, attachments:[]},
    {id:"t4", company:"D", status:"applied", priority:1, attachments:[]},
  ];
  state.events = [{id:"e1", appId:"t1", type:"submit", ts:Date.now() - 9 * DAY}];
  const s2 = stats();
  ok("统计：进入面试 = 2", s2.interview === 2, String(s2.interview));
  ok("统计：Offer = 1", s2.offer === 1);
  ok("统计：投出去 7 天没动静 = 1", s2.noReply === 1, String(s2.noReply));
  ok("统计：进行中 = 3", s2.active === 3, String(s2.active));
  ok("薪资列表 len 2 / 过滤掉未填", salaryList().length === 2, JSON.stringify(salaryList()));
  ok("即将到期：无日期时为空", upcoming(7).length === 0);
  state.apps[3].deadline = isoOf(new Date(Date.now() + 2 * DAY));
  const up2 = upcoming(7);
  ok("即将到期：识别 2 天后截止", up2.length === 1 && up2[0].days === 2, JSON.stringify(up2.map(x => x.days)));
  state.apps[3].deadline = isoOf(new Date(Date.now() - 2 * DAY));
  ok("逾期识别", overdue().length === 1);
  /* 「永不」提醒开关 */
  const hadDays = state.settings.daysAhead;
  state.settings.daysAhead = "off";
  ok("永不：remindersOff 为真", remindersOff() === true);
  ok("永不：即将到期为空", upcoming(30).length === 0);
  ok("永不：逾期也为空", overdue().length === 0);
  ok("永不：activeDays 不为 NaN", !isNaN(activeDays()), String(activeDays()));
  state.settings.daysAhead = 7;
  ok("恢复 7 天：重新开始提醒", upcoming(7).length === 1 && remindersOff() === false);
  state.settings.daysAhead = hadDays;
  ok("排序：心动指数优先", sortApps(state.apps)[0].company === "A" || state.settings.sort !== "priority");
  state.apps = had; state.events = hadEv;

  /* DOM 骨架 */
  ok("五个主视图都在", ["dash","list","timeline","stats","settings"].every(n => $("#view-" + n)));
  ok("底部导航 5 个入口", $$("#tabbar button").length === 5, String($$("#tabbar button").length));
  ok("总览已渲染内容", $("#view-dash").childElementCount > 0, String($("#view-dash").childElementCount));
  ok("画布 #overlay / #sheet 存在", !!$("#overlay") && !!$("#sheet"));
  ok("JSON 导入 input 已挂载", !!$("#fileJson"));
  ok("存储可写（CAN_PERSIST）", CAN_PERSIST);

  /* PWA */
  ok("manifest 链接存在", !!document.querySelector('link[rel="manifest"]'));
  ok("apple-touch-icon 链接存在", !!document.querySelector('link[rel="apple-touch-icon"]'));
  ok("viewport 开启 viewport-fit=cover", /viewport-fit=cover/.test((document.querySelector('meta[name="viewport"]') || {}).content || ""));
  ok("Service Worker 可用", ("serviceWorker" in navigator) || location.protocol === "file:");
  ok("PWA 状态可读", ["installed","ready","ios","insecure","file","manual"].indexOf(PWA.state()) >= 0, PWA.state());
  ok("安装卡片渲染进设置页", !!$("#view-settings") && document.body.innerHTML.indexOf("装到手机桌面") >= 0);
  if(location.protocol === "file:"){
    ok("file:// 下不注册 SW（符合预期）", true, "本地文件方式，安装与离线缓存不可用，属正常");
  } else if(location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)){
    ok("安全上下文允许安装", PWA.isSecureContextOk(), location.protocol);
  } else {
    ok("http 非本机 -> 不注册 SW（符合预期）", !PWA.isSecureContextOk(), location.host);
  }

  const pass = results.filter(r => r.pass).length;
  const fail = results.length - pass;

  /* 渲染报告 */
  const body = el("div");
  body.appendChild(el("div", {cls:"alert " + (fail ? "danger" : "info")}, [
    el("div", {}, [
      el("b", {text:fail ? (fail + " 项未通过") : "全部通过"}),
      el("div", {cls:"tiny", text:"共 " + results.length + " 项 · 通过 " + pass + " · 失败 " + fail,
        style:{marginTop:"2px", opacity:".8"}}),
    ]),
  ]));
  results.forEach(r => {
    body.appendChild(el("div", {cls:"kv"}, [
      el("span", {cls:"k", text:r.pass ? "✓" : "✗", style:{color:r.pass ? "var(--ok)" : "var(--danger)", width:"22px", fontWeight:"800"}}),
      el("span", {cls:"v"}, [
        el("div", {text:r.name, style:{fontSize:"13px"}}),
        r.detail ? el("div", {cls:"tiny dim mono", text:r.detail}) : null,
      ]),
    ]));
  });
  openSheet("自检报告（" + pass + "/" + results.length + "）", body, [
    el("button", {cls:"btn primary", text:"知道了", on:{click:closeSheet}}),
  ]);
  console.log("[selftest]", pass + "/" + results.length, results.filter(r => !r.pass));
  return {pass:pass, fail:fail, results:results};
}
window.__internTrackerSelfTest = runSelfTest;

/* 请求“持久化存储”许可：手机存储紧张时，浏览器默认可能清掉网站数据，
   申请之后这份数据会被优先保留。不支持的浏览器静默跳过。 */
let PERSIST_STATE = "unsupported";
function requestPersistentStorage(){
  try{
    if(!navigator.storage || !navigator.storage.persist){ PERSIST_STATE = "unsupported"; return; }
    navigator.storage.persisted().then(already => {
      if(already){ PERSIST_STATE = "granted"; return null; }
      return navigator.storage.persist().then(ok => { PERSIST_STATE = ok ? "granted" : "denied"; });
    }).catch(() => { PERSIST_STATE = "unknown"; });
  }catch(e){ PERSIST_STATE = "unsupported"; }
}

/* ============================================================
   21. 启动
   ============================================================ */
(function mountJsonPicker(){
  const fj = el("input", {attrs:{type:"file", accept:".json,application/json"}});
  fj.id = "fileJson";
  fj.style.display = "none";
  fj.addEventListener("change", () => {
    if(fj.files && fj.files[0]) importJSONFile(fj.files[0]);
    fj.value = "";
  });
  document.body.appendChild(fj);
})();

buildShell();

/* 申请持久化存储（降低被浏览器自动清理数据的风险） */
requestPersistentStorage();

/* PWA：注册 Service Worker（离线缓存 + 后台更新）。失败不影响应用本身。 */
try{ PWA.registerSW(); }catch(err){ console.warn("PWA 初始化失败", err); }

window.addEventListener("beforeunload", flush);
document.addEventListener("visibilitychange", () => { if(document.hidden) flush(); });

if(/[?&]selftest=1\b/.test(location.search)){
  try{ runSelfTest(); }catch(err){ console.error("自检异常", err); toast("自检异常：" + err.message); }
}
})();
